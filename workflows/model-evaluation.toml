# Three-model comparison on one frozen sample selection; historical training is separate.
stage = "laya-multilingual-kodoom-dibaone-x1-sampled-comparison"
plan = "project-plan.md v42; KD-04/KD-06"
provider = "kaggle"
accelerator = "T4"
backend = "torch"
notebook = "notebooks/external-evaluation.ipynb"
code_branch = "codex/evaluate-parsinlu-persianqa"
models = ["laya-multilingual", "kodoom", "dibaone-x1"]
model_repo = "Farahani/kodoom"
model_run_id = "laya-full-v1"
model_revision = "f315b5da129e2b1df55d971ddf2053c3cbfe5282"
model_path = "laya-full-v1/best"
laya_model = "convaiinnovations/laya-multilingual"
laya_revision = "1720e3e3357cfe1e281542e223f8273b0890ca34"
diba_model = "Dibachain/DibaOne-X1"
diba_revision_policy = "resolve-once-before-inference; persist-exact-sha-in-manifest"
parsinlu_repository = "https://github.com/persiannlp/parsinlu"
parsinlu_revision = "a3b08d0b93ca84e0017e2f490a2aa3ab36c79885"
parsinlu_tasks = ["entailment", "paraphrase", "sentiment", "multiple-choice-qa"]
persianqa_protocol = "answerability-to-two-choice"
translated_repo = "Farahani/kodoom-en-fa"
translated_revision = "1b98bbba48043c62c6ae2c821a55b6f8a5e7a927"
translated_selection = "configs/dataset-baseline.toml"
translated_heldout = "typed_decisions/test; group-by-workflow; Persian-only"
translated_diagnostic = "helmo/train; group-by-topic; not-held-out"
seed = 17
native_cases_per_group = 100
translated_cases_per_group = 3
include_helmo = true
microbatch = 4
sampling_unit = "whole-source-case; stable-seeded-hash; all-case-questions"
protocol = "shared-choice-persian-v2; same-conversion-for-all-three; retain-original-type"
evaluation_split_policy = "native-heldout-and-translated-test; helmo-source-train-diagnostic-separate"
outputs = ["<benchmark>/<model>.jsonl", "comparison.csv", "summary.csv", "samples.json", "report.json", "manifest.json"]
storage = "private-kaggle-output; do-not-commit-source-rows-or-model-weights"
stop = "three-model predictions and comparison saved; disclose failed coverage; no test calibration or publication"

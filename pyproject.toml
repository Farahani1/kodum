[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kodoom"
version = "0.1.0"
description = "An open, Persian-capable typed-decision model: data, training and evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "0BSD"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyarrow>=15"]
# Installed on Colab only. Colab already ships torch with CUDA; CUDA-only
# packages (e.g. bitsandbytes) are added here when code needs them. The two below
# are for "kodoom inspect", which reads a dataset from the Hugging Face hub.
colab = [
    "huggingface_hub>=0.24",
    "pyarrow>=15",
    "transformers>=4.56",
    "accelerate>=1.0",
    "bitsandbytes>=0.43",
]
gpu = [
    "huggingface_hub>=0.34,<1",
    "pyarrow>=15,<26",
    "transformers>=4.56,<5",
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.43,<1",
]
tpu = [
    "kagglehub==0.3.13",
    "gemma==3.3.0",
    "jax[tpu]==0.7.2; sys_platform == 'linux'",
    "kauldron==1.4.2",
    "flax==0.11.2",
    "orbax-checkpoint==0.11.28",
    "optax==0.2.6",
    "sentencepiece==0.2.1",
    "huggingface_hub>=0.34,<1",
    "pyarrow>=15,<26",
]

[project.scripts]
kodoom = "kodoom.cli:main"
kodoom-workflow = "kodoom.workflow:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kodoom = ["profiles/*.toml", "generators/templates/*.toml", "translate/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Some test files import helpers from other test files (`from tests.x import ...`); this
# makes that work for a plain `pytest` as CI runs it, not only for `python -m pytest`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Persian text in strings and comments is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

question = "این مبلغ تو کدوم بازه هست؟"

[[template]]
kind = "magnitude"
id = "magnitude-5"
register = "formal"
held_out = true
state = "مبلغ تراکنش {d} تومان ثبت شده است."
question = "این مبلغ در کدام بازه قرار می گیرد؟"

[[template]]
kind = "magnitude"
id = "magnitude-6"

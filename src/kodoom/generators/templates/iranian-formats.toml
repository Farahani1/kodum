# Templates for the Iranian-format skills (plan 1.1). Same conventions as
# jalali-dates.toml: written as typed (plain spaces, no ZWNJ), cleaned on load.
#
# Placeholder: {n} is a mobile number or a postal code, written as people write
# them: national "0912 345 6789", international "+98 912 345 6789", codes as
# "12345-67890", in Persian, Latin or Arabic-Indic digits.
#
# STATUS: drafted by the project's assistant, not yet reviewed by a native
# speaker. Read every template aloud once before the suite is published.

# ---------------------------------------------------------------------------
# mobile: is this a valid Iranian mobile number? (noul)
# ---------------------------------------------------------------------------

[[template]]
kind = "mobile"
id = "mobile-1"
register = "formal"
held_out = false
state = "در فرم ثبت نام، شماره موبایل متقاضی {n} وارد شده است."
question = "آیا این یک شماره موبایل معتبر ایرانی است؟"

[[template]]
kind = "mobile"
id = "mobile-2"
register = "colloquial"
held_out = false
state = "دوستم شمارش رو داد: {n}."
question = "این شماره موبایل ایرانی درسته؟"

[[template]]
kind = "mobile"
id = "mobile-3"
register = "formal"
held_out = false
state = "شماره تماس مشتری در سامانه {n} ثبت شده است."
question = "آیا شماره ثبت شده قالب یک شماره تلفن همراه ایرانی را دارد؟"

[[template]]
kind = "mobile"
id = "mobile-4"
register = "colloquial"
held_out = false
state = "تو کارت ویزیت نوشته {n}."
question = "این یه شماره موبایل ایرانیه؟"

[[template]]
kind = "mobile"
id = "mobile-5"
register = "formal"
held_out = true
state = "پیامک تایید به شماره {n} ارسال شده است."
question = "آیا این شماره یک شماره موبایل معتبر ایران است؟"

[[template]]
kind = "mobile"
id = "mobile-6"
register = "colloquial"
held_out = true
state = "طرف گفت شمارم اینه: {n}."
question = "این شماره موبایل معتبره؟"

# ---------------------------------------------------------------------------
# postal: is this a valid 10-digit postal code? (noul)
# ---------------------------------------------------------------------------

[[template]]
kind = "postal"
id = "postal-1"
register = "formal"
held_out = false
state = "در فرم ثبت آدرس، کد پستی {n} وارد شده است."
question = "آیا این یک کد پستی ده رقمی معتبر است؟"

[[template]]
kind = "postal"
id = "postal-2"
register = "colloquial"
held_out = false
state = "رو بسته نوشته کد پستی {n}."
question = "این کد پستی ده رقمیه درسته؟"

[[template]]
kind = "postal"
id = "postal-3"
register = "formal"
held_out = false
state = "کد پستی گیرنده {n} درج شده است."
question = "آیا کد پستی درج شده یک کد پستی ده رقمی معتبر است؟"

[[template]]
kind = "postal"
id = "postal-4"
register = "colloquial"
held_out = false
state = "آدرسش رو دادن و کد پستیش {n} هست."
question = "این کد پستی معتبره؟"

[[template]]
kind = "postal"
id = "postal-5"
register = "formal"
held_out = true
state = "کد پستی محل سکونت {n} اعلام شده است."
question = "آیا این کد پستی از نظر قالب ده رقمی معتبر است؟"

[[template]]
kind = "postal"
id = "postal-6"
register = "colloquial"
held_out = true
state = "پیک کد پستی رو خواست و من {n} رو گفتم."
question = "این کد پستی درسته؟"

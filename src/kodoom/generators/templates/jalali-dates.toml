# Templates for the Jalali-date skills (plan 1.1).
#
# Written as people type: plain spaces, no zero-width non-joiners. The loader
# runs clean_orthography() over every text, which puts the ZWNJ in "می شود" and
# "کتاب ها", so this file stays free of invisible characters.
#
# Placeholders: {a} and {b} (kind "before"), {d} (every other kind). Dates are
# rendered by the generator in one of three digit scripts and two formats.
#
# Rules, checked by tests/test_generators.py:
#   - every kind has at least 5 templates, exactly 2 of them held_out = true;
#   - each kind has both registers among train templates and among held-out ones;
#   - held-out templates only ever produce split "test" items (plan 3.1).
#
# STATUS: drafted by the project's assistant, not yet reviewed by a native
# speaker. Read every template aloud once before the suite is published; a
# template that sounds unnatural is a bug, not a style choice.

# ---------------------------------------------------------------------------
# before: "is the first date before / after the second?" (noul)
# relation = "before": does event a happen before event b?
# relation = "after":  does event a happen after event b?
# ---------------------------------------------------------------------------

[[template]]
kind = "before"
id = "before-1"
register = "formal"
held_out = false
relation = "before"
state = "جلسه هیئت مدیره در تاریخ {a} برگزار می شود و مهلت ثبت گزارش مالی {b} است."
question = "آیا جلسه هیئت مدیره پیش از مهلت ثبت گزارش مالی برگزار می شود؟"

[[template]]
kind = "before"
id = "before-2"
register = "colloquial"
held_out = false
relation = "before"
state = "قرار ملاقاتمون {a} هست و تحویل پروژه {b}."
question = "قرار ملاقات زودتر از تحویل پروژه هست؟"

[[template]]
kind = "before"
id = "before-3"
register = "formal"
held_out = false
relation = "after"
state = "فاکتور در تاریخ {a} صادر شده و سررسید پرداخت آن {b} تعیین شده است."
question = "آیا فاکتور بعد از سررسید پرداخت صادر شده است؟"

[[template]]
kind = "before"
id = "before-4"
register = "colloquial"
held_out = false
relation = "after"
state = "بلیطمون برای {a} هست و هتل رو از {b} رزرو کردم."
question = "بلیط دیرتر از شروع رزرو هتل هست؟"

[[template]]
kind = "before"
id = "before-5"
register = "formal"
held_out = true
relation = "before"
state = "درخواست مرخصی از تاریخ {a} آغاز می شود و قرارداد همکاری در {b} پایان می یابد."
question = "آیا شروع مرخصی پیش از پایان قرارداد همکاری است؟"

[[template]]
kind = "before"
id = "before-6"
register = "colloquial"
held_out = true
relation = "after"
state = "امتحان من {a} هست و امتحان دوستم {b}."
question = "امتحان من دیرتر از امتحان دوستمه؟"


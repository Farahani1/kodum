# English -> Persian terms for the typed-decisions workflows (plan 1.1, "Glossary and
# register"). One Persian term per English term, so a state and its options name the
# same thing the same way. DRAFT: written by the assistant, waiting for review by a
# native speaker; the terms below are the ones the plan's dataset card will publish.
# Zero-width non-joiners are written as \u200c.

[keep]
# Technical terms that stay in English (Latin script), exactly as written.

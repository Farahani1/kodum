# Colab T4, real models, a small slice: catches T4-only failures
# (fp16 overflow, GPU memory, CUDA kernels) in about 5 minutes,
# before a full session is spent.

[run]
seed = 1234
runs_dir = "/content/drive/MyDrive/kodoom/runs/preflight"

[compute]
device = "cuda"
precision = "fp16"

[data]
max_cases_per_source = 200

[storage]
# The runtime's own disk: fast, large, wiped when the session ends.
scratch_dir = "/content/kodoom-scratch"
cache_dir = "/content/hf-cache"
# Drive is shared with Gmail and Photos (free 15 GB): keep 1 GB free.
reserve_gb = 1
